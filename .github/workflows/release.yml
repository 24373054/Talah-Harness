name: Signed release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIGNING_PFX_BASE64: ${{ secrets.MSIX_SIGNING_PFX_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.MSIX_SIGNING_PASSWORD }}
      SIGNING_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
      TIMESTAMP_URL: ${{ vars.MSIX_TIMESTAMP_URL }}
      UPDATE_BASE_URI: ${{ vars.RELEASE_BASE_URI }}
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Validate tag and signing configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = 'v1.0.0'
          if ('${{ github.ref_name }}' -ne $expected) { throw "This release branch is version 1.0.0; expected tag $expected." }
          foreach ($name in @('SIGNING_PFX_BASE64', 'SIGNING_PASSWORD', 'SIGNING_PUBLISHER', 'UPDATE_BASE_URI')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item -LiteralPath "Env:$name").Value)) { throw "Required release configuration is absent: $name" }
          }
          if (-not $env:UPDATE_BASE_URI.StartsWith('https://', [System.StringComparison]::OrdinalIgnoreCase)) { throw 'RELEASE_BASE_URI must use HTTPS.' }

      - name: Materialize signing certificate outside the checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'talah-harness-release-signing.pfx'
          [System.IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          "SIGNING_PFX_PATH=$path" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, test, sign, and validate release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $password = ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force
          $timestamp = if ([string]::IsNullOrWhiteSpace($env:TIMESTAMP_URL)) { 'http://timestamp.digicert.com' } else { $env:TIMESTAMP_URL }
          ./tools/release/Build-Release.ps1 -Publisher $env:SIGNING_PUBLISHER -CertificatePath $env:SIGNING_PFX_PATH -CertificatePassword $password -TimestampUrl $timestamp -UpdateBaseUri $env:UPDATE_BASE_URI

      - name: Upload signed release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Talah-Harness-1.0.0-signed
          path: build/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    needs: signed-release
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated signed release build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Talah-Harness-1.0.0-signed
          path: build/release

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            build/release/packages/*.msix
            build/release/Talah-Harness.appinstaller
            build/release/update-manifest.json
            build/release/provenance.json
            build/release/SHA256SUMS
            build/release/metadata/sbom.cdx.json
            build/release/metadata/nuget-dependencies.json
            build/release/metadata/THIRD-PARTY-NOTICES.md
            build/release/metadata/LICENSE
