name: CI release validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and pinned submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Build, test, publish, package, and validate
        shell: pwsh
        run: ./tools/release/Build-Release.ps1

      - name: Upload unsigned validation artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Talah-Harness-${{ github.sha }}-unsigned-development
          path: build/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
